<!DOCTYPE html>
<html>
<head>

<title>SVG Preview</title>

<body>

    <!-- small trailing tail -->
    <path d="M380 62 C392 60, 410 62, 430 68" stroke="#1a1a1a" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </svg>
</body>
</html>
