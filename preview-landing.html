<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unwind Landing Preview</title>
<style>
:root { color-scheme: light; }
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap');

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  background: #000;
  color: #fff;
  -webkit-font-smoothing: antialiased;
}

.landing {
  position: relative;
  width: 100%;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: #000;
}

.landing-bg-anim {
  position: absolute;
  inset: -50%;
  width: 200%;
  height: 200%;
  z-index: 0;
  animation: swirlRotate 30s linear infinite;
}

.landing-bg-anim::before,
.landing-bg-anim::after {
  content: '';
  position: absolute;
  inset: 0;
}

.landing-bg-anim::before {
  background: conic-gradient(from 0deg at 50% 50%,
    transparent 0deg, rgba(80,120,200,0.15) 30deg, transparent 60deg,
    rgba(100,140,220,0.1) 120deg, transparent 150deg, rgba(60,100,180,0.12) 210deg,
    transparent 240deg, rgba(90,130,210,0.08) 300deg, transparent 330deg,
    rgba(80,120,200,0.15) 360deg);
  filter: blur(40px);
}

.landing-bg-anim::after {
  background: conic-gradient(from 180deg at 50% 50%,
    transparent 0deg, rgba(180,160,100,0.08) 40deg, transparent 80deg,
    rgba(200,180,120,0.06) 160deg, transparent 200deg, rgba(160,140,80,0.07) 280deg,
    transparent 320deg, rgba(180,160,100,0.08) 360deg);
  filter: blur(30px);
  animation: swirlR2 20s linear infinite reverse;
}

@keyframes swirlRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes swirlR2 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.landing-bg-stars {
  position: absolute;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.7), transparent),
    radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1.5px 1.5px at 15% 85%, rgba(255,255,255,0.4), transparent),
    radial-gradient(1px 1px at 45% 75%, rgba(255,255,255,0.6), transparent),
    radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,0.35), transparent),
    radial-gradient(1.5px 1.5px at 60% 50%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1px 1px at 25% 35%, rgba(255,255,255,0.45), transparent),
    radial-gradient(1px 1px at 85% 65%, rgba(255,255,255,0.3), transparent),
    radial-gradient(1px 1px at 5% 55%, rgba(255,255,255,0.5), transparent),
    radial-gradient(1.5px 1.5px at 40% 90%, rgba(255,255,255,0.35), transparent),
    radial-gradient(1px 1px at 95% 30%, rgba(255,255,255,0.55), transparent),
    radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,0.25), transparent);
  animation: twinkle 4s ease-in-out infinite alternate;
}

@keyframes twinkle { 0% { opacity: 0.6; } 100% { opacity: 1; } }

.liquid-glass {
  background: rgba(255, 255, 255, 0.01);
  background-blend-mode: luminosity;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  border: none;
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
  position: relative;
  overflow: hidden;
}

.liquid-glass::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1.4px;
  background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.landing-nav {
  position: relative;
  z-index: 20;
  padding: 24px;
}

.landing-nav-inner {
  border-radius: 9999px;
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 720px;
  margin: 0 auto;
}

.landing-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #fff;
  font-weight: 500;
  font-size: 16px;
  cursor: pointer;
}

.landing-nav-links {
  display: flex;
  gap: 6px;
}

.landing-nav-links button {
  background: none;
  border: none;
  color: rgba(255,255,255,0.7);
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  padding: 6px 14px;
  border-radius: 9999px;
  transition: color 0.2s, background 0.2s;
}

.landing-nav-links button:hover {
  color: #fff;
  background: rgba(255,255,255,0.05);
}

.landing-hero {
  position: relative;
  z-index: 10;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 24px 48px;
  text-align: center;
  transform: translateY(-6%);
}

.landing-hero h1 {
  font-family: 'Instrument Serif', serif;
  font-size: clamp(52px, 10vw, 96px);
  font-weight: 400;
  color: #fff;
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin-bottom: 16px;
}

.landing-hero h1 em { font-style: italic; }

.landing-subtitle {
  font-size: 15px;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.12em;
  margin-bottom: 48px;
  font-weight: 300;
}

.landing-categories {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 560px;
  margin-bottom: 40px;
}

.landing-cat-btn {
  border-radius: 9999px;
  padding: 10px 28px;
  color: rgba(255,255,255,0.85);
  font-size: 15px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: color 0.2s, background 0.2s;
}

.landing-cat-btn:hover {
  color: #fff;
  background: rgba(255,255,255,0.06);
}

.landing-tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 480px;
}

.landing-tag-pill {
  border-radius: 9999px;
  padding: 6px 16px;
  color: rgba(255,255,255,0.45);
  font-size: 12px;
  font-weight: 400;
  font-family: inherit;
  cursor: pointer;
  transition: color 0.2s, background 0.2s;
}

.landing-tag-pill:hover {
  color: rgba(255,255,255,0.8);
  background: rgba(255,255,255,0.05);
}

.landing-footer {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: center;
  padding-bottom: 32px;
}

.landing-footer span {
  font-size: 12px;
  color: rgba(255,255,255,0.25);
  letter-spacing: 0.04em;
}

.private-btn {
  border-radius: 9999px;
  padding: 6px 18px;
  color: #fff;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
}

/* Inner pages simulation */
.inner-page {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #fafafa;
  color: #1a1a1a;
  overflow-y: auto;
  animation: fadeIn 0.3s ease;
}

.inner-page.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.inner-content {
  max-width: 640px;
  margin: 0 auto;
  padding: 32px 24px;
}

.back-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
  color: #999;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color 0.2s;
}

.back-btn:hover { color: #1a1a1a; }

.inner-title {
  font-size: 20px;
  font-weight: 500;
  margin-bottom: 8px;
}

.inner-subtitle {
  color: #999;
  font-size: 14px;
  margin-bottom: 32px;
}

.placeholder-card {
  padding: 20px 0;
  border-bottom: 1px solid #e5e5e5;
}

.placeholder-card .ph-line {
  height: 12px;
  background: #eee;
  border-radius: 4px;
  margin-bottom: 8px;
}

.placeholder-card .ph-line:last-child { margin-bottom: 0; }

@media (max-width: 640px) {
  .landing-nav { padding: 16px; }
  .landing-nav-inner { padding: 10px 16px; }
  .landing-nav-links { display: none; }
  .landing-hero h1 { font-size: 44px; }
  .landing-subtitle { font-size: 13px; margin-bottom: 32px; }
  .landing-categories { gap: 8px; }
  .landing-cat-btn { font-size: 13px; padding: 8px 20px; }
  .landing-tags { gap: 6px; }
  .landing-tag-pill { font-size: 11px; padding: 5px 12px; }
}
</style>
</head>
<body>

<div class="landing">
  <div class="landing-bg-anim"></div>
  <div class="landing-bg-stars"></div>

  <div class="landing-nav">
    <div class="landing-nav-inner liquid-glass">
      <div class="landing-logo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span>Unwind</span>
      </div>
      <div class="landing-nav-links">
        <button onclick="showPage('stream')">Stream</button>
        <button onclick="showPage('writing')">Writing</button>
        <button onclick="showPage('reading')">Reading</button>
      </div>
      <button class="liquid-glass private-btn" onclick="showPage('private')">Private</button>
    </div>
  </div>

  <div class="landing-hero">
    <h1><em>Unwind</em></h1>
    <p class="landing-subtitle">把纏在一起的問題，一條一條理開</p>

    <div class="landing-categories">
      <button class="landing-cat-btn liquid-glass" onclick="showPage('stream')">Stream</button>
      <button class="landing-cat-btn liquid-glass" onclick="showPage('writing')">Writing</button>
      <button class="landing-cat-btn liquid-glass" onclick="showPage('highlights')">Highlights</button>
      <button class="landing-cat-btn liquid-glass" onclick="showPage('reading')">Reading</button>
      <button class="landing-cat-btn liquid-glass" onclick="showPage('graph')">Graph</button>
    </div>

    <div class="landing-tags">
      <button class="landing-tag-pill liquid-glass" onclick="showPage('tag')">#productivity</button>
      <button class="landing-tag-pill liquid-glass" onclick="showPage('tag')">#reading</button>
      <button class="landing-tag-pill liquid-glass" onclick="showPage('tag')">#self-care</button>
      <button class="landing-tag-pill liquid-glass" onclick="showPage('tag')">#mindset</button>
      <button class="landing-tag-pill liquid-glass" onclick="showPage('tag')">#learning</button>
    </div>
  </div>

  <div class="landing-footer">
    <span>by charlesshen</span>
  </div>
</div>

<!-- Simulated inner pages -->
<div class="inner-page" id="page-stream">
  <div class="inner-content">
    <button class="back-btn" onclick="goBack()">← Unwind</button>
    <h1 class="inner-title">Stream</h1>
    <p class="inner-subtitle">短想法、隨筆、日常觀察</p>
    <div class="placeholder-card"><div class="ph-line" style="width:85%"></div><div class="ph-line" style="width:60%"></div></div>
    <div class="placeholder-card"><div class="ph-line" style="width:70%"></div><div class="ph-line" style="width:90%"></div><div class="ph-line" style="width:40%"></div></div>
    <div class="placeholder-card"><div class="ph-line" style="width:55%"></div><div class="ph-line" style="width:75%"></div></div>
  </div>
</div>

<div class="inner-page" id="page-writing">
  <div class="inner-content">
    <button class="back-btn" onclick="goBack()">← Unwind</button>
    <h1 class="inner-title">Writing</h1>
    <p class="inner-subtitle">長一點的文章和思考</p>
    <div class="placeholder-card"><div class="ph-line" style="width:60%"></div><div class="ph-line" style="width:95%"></div><div class="ph-line" style="width:80%"></div></div>
    <div class="placeholder-card"><div class="ph-line" style="width:50%"></div><div class="ph-line" style="width:85%"></div></div>
  </div>
</div>

<div class="inner-page" id="page-highlights">
  <div class="inner-content">
    <button class="back-btn" onclick="goBack()">← Unwind</button>
    <h1 class="inner-title">Highlights</h1>
    <p class="inner-subtitle">人生的精華時刻</p>
    <div class="placeholder-card"><div class="ph-line" style="width:45%"></div><div class="ph-line" style="width:70%"></div></div>
    <div class="placeholder-card"><div class="ph-line" style="width:65%"></div><div class="ph-line" style="width:50%"></div></div>
  </div>
</div>

<div class="inner-page" id="page-reading">
  <div class="inner-content">
    <button class="back-btn" onclick="goBack()">← Unwind</button>
    <h1 class="inner-title">Reading Notes</h1>
    <p class="inner-subtitle">Kobo 書摘</p>
    <div class="placeholder-card"><div class="ph-line" style="width:75%"></div><div class="ph-line" style="width:90%"></div><div class="ph-line" style="width:55%"></div></div>
  </div>
</div>

<div class="inner-page" id="page-graph">
  <div class="inner-content">
    <button class="back-btn" onclick="goBack()">← Unwind</button>
    <h1 class="inner-title">Graph</h1>
    <p class="inner-subtitle">內容之間的連結關係</p>
    <div style="height:200px;border:1px solid #e5e5e5;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#999;font-size:14px;">Graph View</div>
  </div>
</div>

<div class="inner-page" id="page-private">
  <div class="inner-content">
    <button class="back-btn" onclick="goBack()">← Unwind</button>
    <h1 class="inner-title">Private</h1>
    <p class="inner-subtitle">輸入密碼以查看私密內容</p>
    <div style="max-width:320px"><input type="password" placeholder="Password" style="width:100%;padding:10px 12px;border:1px solid #e5e5e5;border-radius:6px;font-size:15px;font-family:inherit;background:#fff;"></div>
  </div>
</div>

<div class="inner-page" id="page-tag">
  <div class="inner-content">
    <button class="back-btn" onclick="goBack()">← Unwind</button>
    <h1 class="inner-title">#productivity</h1>
    <p class="inner-subtitle">3 篇內容</p>
    <div class="placeholder-card"><div class="ph-line" style="width:80%"></div><div class="ph-line" style="width:55%"></div></div>
    <div class="placeholder-card"><div class="ph-line" style="width:65%"></div><div class="ph-line" style="width:85%"></div></div>
  </div>
</div>

<script>
function showPage(name) {
  document.getElementById('page-' + name).classList.add('active');
}
function goBack() {
  document.querySelectorAll('.inner-page').forEach(function(p) {
    p.classList.remove('active');
  });
}
</script>
</body>
</html>
